name: release

# I cannot see what flowers are at my feet,
#   Nor what soft incense hangs upon the boughs,
# But, in embalmed darkness, guess each sweet
#   Wherewith the seasonable month endows
# - Keats

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  SIGNING_CLI_VERSION: 0.11.0

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  windows:
    name: windows
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # thank the lord, as I am forgetful
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install signing CLI
        shell: bash
        run: |
          curl -sSLf \
            -o "$HOME/.cargo/bin/artifact-signing-cli.exe" \
            "https://github.com/Levminer/artifact-signing-cli/releases/download/${SIGNING_CLI_VERSION}/artifact-signing-cli.exe"
          artifact-signing-cli --version

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Limestone ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles nsis --config src-tauri/tauri.signing.conf.json

