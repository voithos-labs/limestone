name: release

# I cannot see what flowers are at my feet,
#   Nor what soft incense hangs upon the boughs,
# But, in embalmed darkness, guess each sweet
#   Wherewith the seasonable month endows
# - Keats

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  SIGNING_CLI_VERSION: 0.11.0

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  windows:
    name: windows
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # thank the lord, as I am forgetful
      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache signing CLI
        id: signing-cli
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/artifact-signing-cli.exe
          key: artifact-signing-cli-${{ env.SIGNING_CLI_VERSION }}

      - name: Install signing CLI
        if: steps.signing-cli.outputs.cache-hit != 'true'
        run: cargo install artifact-signing-cli --version ${{ env.SIGNING_CLI_VERSION }} --locked

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Limestone ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles nsis --config src-tauri/tauri.signing.conf.json

